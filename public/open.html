<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>html,body{margin:0;padding:0;background:#0d1b2e;min-height:100vh}</style>
  <script>
    var params = new URLSearchParams(window.location.search);
    var mn = params.get('memberNumber') || '';
    var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
    if (isIOS) {
      window.location.href = 'dtmhandicap://login' + (mn ? '?memberNumber=' + encodeURIComponent(mn) : '');
    } else {
      window.location.href = 'https://app.dtmhandicap.com/?screen=login' + (mn ? '&memberNumber=' + encodeURIComponent(mn) : '');
    }
  </script>
</head>
<body></body>
</html>
